<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Axionis Voice — Status</title>
<style>
  @property --beam-a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  :root {
    --obsidian: #0E0F12;
    --coal: #161720;
    --coal-2: #1c1d28;
    --ember: #FF5A36;
    --ember-2: #ff7a52;
    --ember-glow: rgba(255,90,54,0.55);
    --ember-line: rgba(255,90,54,0.45);
    --bone: #F1ECE3;
    --bone-dim: #cfc8bd;
    --ash: #8A8178;
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  body {
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    /* Innenpolster, damit weiche box-shadow/Glow-Kanten nicht hart an der Fensterkante
       abgeschnitten werden. Bewusst knapp (nicht mehr 36px): die Pille sitzt unten
       rechts im Fenster, jedes zusaetzliche Pixel Polster ist beim Ziehen an den
       oberen/linken Bildschirmrand als Luecke sichtbar, die sich nicht wegziehen laesst. */
    padding: 16px;
    box-sizing: border-box;
    opacity: 0;
    animation: widget-in .28s cubic-bezier(.16,1,.3,1) forwards;
  }
  @keyframes widget-in { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: scale(1); } }

  .widget { position: relative; display: flex; align-items: flex-end; justify-content: flex-end; }

  /* Aeusserer Licht-Ring waehrend der Verarbeitung — dieselbe "Beam"-Technik wie auf der
     Website (rotierender Lichtstreifen am Rand via conic-gradient + Masken-Ring), nur
     ohne filter:drop-shadow — das rendert in diesem transparenten Fenster als sichtbares
     Rechteck statt als weicher Schein. */
  .halo {
    position: absolute;
    right: -2px;
    bottom: -2px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    padding: 1.5px;
    box-sizing: border-box;
    opacity: 0;
    pointer-events: none;
    background: conic-gradient(from var(--beam-a), transparent 0 64%, var(--ember) 78%, #fff 88%, var(--ember-2) 96%, transparent 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    animation: beamspin 2s linear infinite;
  }
  body.state-processing .halo { opacity: 1; }
  @keyframes beamspin { to { --beam-a: 360deg; } }

  .pill {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5px;
    height: 33px;
    width: 33px;
    padding: 0 9px;
    border-radius: 17px;
    background: linear-gradient(160deg, var(--coal-2), var(--obsidian));
    border: 1px solid rgba(241,236,227,0.10);
    box-shadow: 0 6px 16px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    cursor: pointer;
    transition: width .22s cubic-bezier(.16,1,.3,1), border-color .18s, box-shadow .18s, transform .15s;
    box-sizing: border-box;
    overflow: hidden;
    z-index: 1;
  }
  .pill:hover {
    transform: scale(1.07);
    border-color: var(--ember-line);
    box-shadow: 0 8px 20px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .bolt { width: 14px; height: 14px; flex: none; }
  .bolt path { fill: var(--ember); transition: fill .2s; }

  /* Ruhezustand: dezenter Bolt */
  body.state-idle .bolt path { fill: #6b6f7a; }

  /* Nicht eingerichtet: pulsierender Ring, ladet zum Klicken ein */
  body.state-needs-setup .pill { animation: needs-setup-pulse 1.8s ease-out infinite; }
  @keyframes needs-setup-pulse {
    0% { box-shadow: 0 6px 16px rgba(0,0,0,0.5), 0 0 0 0 var(--ember-glow); }
    70% { box-shadow: 0 6px 16px rgba(0,0,0,0.5), 0 0 0 8px rgba(255,90,54,0); }
    100% { box-shadow: 0 6px 16px rgba(0,0,0,0.5), 0 0 0 0 rgba(255,90,54,0); }
  }

  /* Aufnahme: Pille wird zum breiten Soundwave-Balken, Logo verschwindet komplett —
     das Logo ist nur zu sehen, wenn keine Aufnahme laeuft. */
  body.state-recording .pill { width: 81px; border-color: var(--ember-line); gap: 0; padding: 0 8px; }
  body.state-recording .bolt { display: none; }
  .wave { display: none; align-items: center; justify-content: center; gap: 2px; height: 22px; width: 100%; }
  body.state-recording .wave { display: flex; }
  .wave span { display: block; width: 2px; border-radius: 2px; background: linear-gradient(180deg, var(--bone) 0%, var(--ember-2) 55%, var(--ember) 100%); transform-origin: center; animation: wave 1.1s ease-in-out infinite; }
  .wave span:nth-child(1){height:25%;animation-delay:-0.1s}
  .wave span:nth-child(2){height:50%;animation-delay:-0.7s}
  .wave span:nth-child(3){height:35%;animation-delay:-1.0s}
  .wave span:nth-child(4){height:75%;animation-delay:-0.4s}
  .wave span:nth-child(5){height:100%;animation-delay:-0.9s}
  .wave span:nth-child(6){height:65%;animation-delay:-0.2s}
  .wave span:nth-child(7){height:85%;animation-delay:-0.6s}
  .wave span:nth-child(8){height:45%;animation-delay:-1.1s}
  .wave span:nth-child(9){height:30%;animation-delay:-0.5s}
  @keyframes wave { 0%, 100% { transform: scaleY(0.25); } 50% { transform: scaleY(1); } }

  /* Fehler: dezenter Ring-Akzent */
  body.state-error .pill { border-color: rgba(255,138,138,0.55); }
</style>
</head>
<body class="state-idle">
  <div class="widget">
    <span class="halo" aria-hidden="true"></span>
    <div class="pill" id="pill">
      <svg class="bolt" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.615 1.595a.75.75 0 0 1 .359.852L12.982 9.75h7.268a.75.75 0 0 1 .548 1.262l-10.5 11.25a.75.75 0 0 1-1.272-.71l1.992-7.302H3.75a.75.75 0 0 1-.548-1.262l10.5-11.25a.75.75 0 0 1 .913-.143Z"/></svg>
      <span class="wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span>
    </div>
  </div>
  <script src="widget-renderer.js"></script>
</body>
</html>
